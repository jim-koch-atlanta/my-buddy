services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mybuddy-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mybuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mybuddy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 1g

volumes:
  postgres_data:
    driver: local